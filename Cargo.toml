[package]
name = "airgap"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]

[features]
default = ["std", "qr"]
std = ["dep:thiserror", "dep:jni"]
qr = ["dep:qrcode", "dep:image", "dep:rand"]

[dependencies]
base45 = { version = "3.2.0", default-features = false }
crc32fast = { version = "1.4", default-features = false }
thiserror = { version = "2.0.18", optional = true }
qrcode = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }
rand = { version = "0.10.0", optional = true }
jni = { version = "0.21.1", default-features = false, optional = true }
wasm-bindgen = { version = "=0.2.100", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[build-dependencies]
cbindgen = "0.29.2"
cc = "1"
