name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Add Android targets
      run: |
        rustup target add aarch64-linux-android
        rustup target add armv7-linux-androideabi
        rustup target add i686-linux-android
        rustup target add x86_64-linux-android

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r27c
        add-to-path: true

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-android-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Android AAR
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        chmod +x build-android.sh
        ./build-android.sh

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: airgap-android-aar
        path: android/airgap/build/outputs/aar/airgap-release.aar
        if-no-files-found: error

  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Add iOS targets
      run: |
        rustup target add aarch64-apple-ios
        rustup target add aarch64-apple-ios-sim
        rustup target add x86_64-apple-ios

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-ios-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-ios-

    - name: Build iOS XCFramework
      run: |
        chmod +x build-ios.sh
        ./build-ios.sh

    - name: Create XCFramework archive
      run: |
        zip -r Airgap.xcframework.zip Airgap.xcframework

    - name: Upload XCFramework artifact
      uses: actions/upload-artifact@v4
      with:
        name: airgap-ios-xcframework
        path: Airgap.xcframework.zip
        if-no-files-found: error

  build-js:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Add WASM target
      run: rustup target add wasm32-unknown-unknown

    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-js-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-js-

    - name: Build WASM package
      run: wasm-pack build --release --target web --out-dir pkg

    - name: Pack npm tarball
      run: npm pack --pack-destination ..
      working-directory: pkg

    - name: Upload WASM artifact
      uses: actions/upload-artifact@v4
      with:
        name: airgap-js-wasm
        path: airgap-*.tgz
        if-no-files-found: error

  build-embedded-arm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Add ARM targets
      run: |
        rustup target add thumbv8m.main-none-eabihf
        rustup target add thumbv7em-none-eabihf
        rustup target add thumbv7m-none-eabi
        rustup target add thumbv6m-none-eabi

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-arm-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-arm-

    - name: Build ARM Cortex-M libraries
      run: |
        chmod +x build-arm.sh
        ./build-arm.sh

    - name: Upload ARM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: airgap-embedded-arm
        path: target/arm/
        if-no-files-found: error

  build-embedded-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-macos-sim-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-macos-sim-

    - name: Build macOS simulator library
      run: |
        chmod +x build-sim.sh
        ./build-sim.sh

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: airgap-embedded-macos
        path: target/sim/
        if-no-files-found: error

  build-embedded-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install ARM64 cross-compiler
      run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-linux-sim-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-linux-sim-

    - name: Build Linux simulator library
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      run: |
        chmod +x build-sim.sh
        ./build-sim.sh

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: airgap-embedded-linux
        path: target/sim/
        if-no-files-found: error

  aggregate-embedded:
    needs: [build-embedded-arm, build-embedded-macos, build-embedded-linux]
    runs-on: ubuntu-latest

    steps:
    - name: Download ARM artifacts
      uses: actions/download-artifact@v4
      with:
        name: airgap-embedded-arm
        path: arm

    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: airgap-embedded-macos
        path: macos

    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: airgap-embedded-linux
        path: linux

    - name: Aggregate into single folder
      run: |
        mkdir -p aggregate
        cp arm/*.a aggregate/
        cp macos/*.a aggregate/
        cp linux/*.a aggregate/
        # Header is identical across all builds
        cp arm/airgap.h aggregate/
        cd aggregate
        tar czf ../airgap-embedded.tar.gz *
        ls -la
        cd ..

    - name: Upload aggregated embedded artifact
      uses: actions/upload-artifact@v4
      with:
        name: airgap-embedded
        path: airgap-embedded.tar.gz
        if-no-files-found: error

  create-release:
    needs: [build-android, build-ios, build-js, aggregate-embedded]
    runs-on: ubuntu-latest

    steps:
    - name: Download Android AAR
      uses: actions/download-artifact@v4
      with:
        name: airgap-android-aar

    - name: Download iOS XCFramework
      uses: actions/download-artifact@v4
      with:
        name: airgap-ios-xcframework

    - name: Download JS WASM package
      uses: actions/download-artifact@v4
      with:
        name: airgap-js-wasm

    - name: Download Embedded libraries
      uses: actions/download-artifact@v4
      with:
        name: airgap-embedded

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          airgap-release.aar
          Airgap.xcframework.zip
          airgap-*.tgz
          airgap-embedded.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}